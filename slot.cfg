<div class="" vcard-notes>
• Добро пожаловать в мою визитку (она же каталог произведений)
• В этом окне настроек собраны все возможности просмотра визитки
• Штамп времени в заголовке плеера = версия = момент обновления данной страницы
• Схема НОЧЬ дает макс яркость, кнопка 0 в лев.цифровом блоке отключает картинки
• ГАЗЕТА = белый фон, ДУО = два цвета + комбинация всегда начинается с Серый/Желтый
• Повторные нажатия значка МОНО/ДУО меняют случайные цвета
• Можно прокрутить воспроизведение к любому куплету по дв.клику
• Яркость фона=0 (в прав.цифровом блоке) или Фон=X (в блоке фона) => полное отключению фона и анимаций
• Фон=картинка => порталы не плавающие

2026-08-14
