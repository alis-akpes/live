name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4
        with:
          path: public

      - name: Checkout private media
        uses: actions/checkout@v4
        with:
          repository: alis-akpes/live.priv
          ref: master
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          path: private

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -d private/usr
          mkdir -p dist
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='usr/' \
            public/ dist/
          cp -a private/usr dist/usr
          test -f dist/index.html
          test -d dist/usr

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
